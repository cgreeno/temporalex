name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.17.3"
  OTP_VERSION: "27.3"
  RUST_VERSION: "stable"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            # priv/native is gitignored — it's where Rustler outputs the
            # compiled .so before mix copies it to _build/.../priv/native/.
            # Without caching priv/native, a fresh checkout has no .so and
            # `mix compile` thinks nothing has changed.
            priv/native
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'native/temporalex_nif/Cargo.toml', 'native/temporalex_nif/src/**') }}
          # No restore-keys — partial restores were the source of the bug:
          # a stale _build was hiding a missing .so. Better to do a clean
          # rebuild on key miss than restore an inconsistent cache.

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            native/temporalex_nif/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ hashFiles('native/temporalex_nif/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-rust-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict

      # mix compile --warnings-as-errors governs ELIXIR warnings only; cargo
      # warnings flow through Rustler without failing the build, so without
      # this the Rust half of the SDK has no warning gate at all. Found the
      # hard way: an unreachable match arm shipped in the v0.7.0 bump, a PR
      # that was entirely Rust.
      - name: Rust warnings are errors
        run: cargo check --manifest-path native/temporalex_nif/Cargo.toml
        env:
          RUSTFLAGS: "-D warnings"
      # MIX_ENV is test globally, so dialyxir must be available in :test
      # (see mix.exs) and the PLTs land under the cached _build/plts.
      - run: mix dialyzer

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/native
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'native/temporalex_nif/Cargo.toml', 'native/temporalex_nif/src/**') }}

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            native/temporalex_nif/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ hashFiles('native/temporalex_nif/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-rust-

      - run: mix deps.get
      # Explicit compile so Rustler builds the NIF and copies it to
      # _build/test/lib/temporalex/priv/native/ before the test runner
      # tries to load Temporalex.Native.
      - run: mix compile
      - run: mix test

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/native
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'native/temporalex_nif/Cargo.toml', 'native/temporalex_nif/src/**') }}

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            native/temporalex_nif/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ hashFiles('native/temporalex_nif/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-rust-

      - run: mix deps.get
      - run: mix compile

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "${HOME}/.temporalio/bin" >> $GITHUB_PATH

      - name: Start Temporal dev server
        run: |
          temporal server start-dev --headless &
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if temporal operator namespace describe default 2>/dev/null; then
              echo "Temporal server is ready"
              break
            fi
            echo "Waiting for Temporal server... ($i/30)"
            sleep 2
          done

      - name: Run integration suite
        run: mix test --include external
