# Hex Release
#
# How to release:
#   1. Bump @version in mix.exs (e.g. "0.3.0" -> "0.3.1")
#   2. Update CHANGELOG.md
#   3. Commit: git commit -am "Release v0.3.1"
#   4. Tag:    git tag v0.3.1
#   5. Push:   git push && git push --tags
#
# The tag push triggers this workflow. It builds precompiled NIFs for
# every supported target (via precompiled.yml), attaches them to the
# GitHub release for the tag, generates the rustler_precompiled checksum
# file, validates the tag matches mix.exs, runs tests, and publishes to
# hex.pm. Consumers then download a prebuilt NIF instead of compiling
# Rust — the checksum file shipped in the package pins the artifacts.
#
# Requires the HEX_API_KEY secret in the repo settings — generate one
# with `mix hex.user key generate` and add it under Settings → Secrets.
#
# Manual trigger is also available from the Actions tab (dry run by
# default).

name: Hex Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't actually publish)"
        required: false
        type: boolean
        default: true

jobs:
  # Tag pushes build the real artifacts through the same matrix that PRs
  # validate. Manual dispatch (dry run) skips this.
  build_nifs:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/precompiled.yml

  release:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    needs: [build_nifs]
    if: always() && (needs.build_nifs.result == 'success' || !startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.3"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/native
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'native/temporalex_nif/Cargo.toml', 'native/temporalex_nif/src/**') }}

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            native/temporalex_nif/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ hashFiles('native/temporalex_nif/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-rust-

      - run: mix deps.get

      - name: Validate tag matches mix.exs version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          MIX_VERSION=$(grep '@version "' mix.exs | sed 's/.*"\(.*\)".*/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "Mix version: $MIX_VERSION"
          if [ "$TAG_VERSION" != "$MIX_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match mix.exs version $MIX_VERSION"
            exit 1
          fi

      - run: mix compile --warnings-as-errors
      - run: mix test

      - name: Build docs
        run: mix docs

      - name: Download precompiled NIFs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          path: nif_artifacts
          merge-multiple: true

      - name: Attach NIFs to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nif_artifacts/*

      # Must run after the release exists: it downloads every artifact from
      # the release URL and writes checksum-Elixir.Temporalex.Native.exs,
      # which the hex package ships (files: checksum-*.exs in mix.exs).
      - name: Generate the checksum file
        if: startsWith(github.ref, 'refs/tags/v')
        run: mix rustler_precompiled.download Temporalex.Native --all --print

      # Tag push → real publish
      - name: Publish to Hex
        if: startsWith(github.ref, 'refs/tags/v')
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      # Manual trigger with dry_run=true → dry run (just builds, no upload)
      - name: Publish to Hex (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.dry_run }}
        run: mix hex.build
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      # Manual trigger with dry_run=false → real publish
      - name: Publish to Hex (manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
