# RUSTFLAGS must reach the cross container (musl needs -crt-static).
[build.env]
passthrough = ["RUSTFLAGS"]

# Cross-compilation containers need protoc: temporalio-sdk-core generates
# its protobuf bindings at build time.
[target.aarch64-unknown-linux-gnu]
pre-build = ["apt-get update && apt-get install -y protobuf-compiler"]

[target.x86_64-unknown-linux-gnu]
pre-build = ["apt-get update && apt-get install -y protobuf-compiler"]

[target.aarch64-unknown-linux-musl]
pre-build = ["apt-get update && apt-get install -y protobuf-compiler"]

[target.x86_64-unknown-linux-musl]
pre-build = ["apt-get update && apt-get install -y protobuf-compiler"]
